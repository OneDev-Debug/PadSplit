name: Build Padsplit IME APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Project Files, Logo, and Description
        run: |
          mkdir -p assets
          mkdir -p app/src/main/java/com/padsplit/ime
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > assets/logo.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120">
            <rect width="240" height="120" rx="22" fill="#06080E" stroke="#1F222B" stroke-width="1.5"/>
            <g fill="#1F222B" fill-opacity="0.75">
              <rect x="20" y="26" width="22" height="20" rx="4"/>
              <rect x="46" y="26" width="22" height="20" rx="4"/>
              <rect x="72" y="26" width="22" height="20" rx="4"/>
              <rect x="52" y="50" width="22" height="20" rx="4"/>
              <rect x="78" y="50" width="22" height="20" rx="4"/>
              <rect x="20" y="74" width="22" height="20" rx="4"/>
              <rect x="46" y="74" width="48" height="20" rx="4"/>
            </g>
            <rect x="26" y="50" width="22" height="20" rx="4" fill="#1F222B" stroke="#C8CCD4" stroke-width="1.5"/>
            <text x="37" y="64" fill="#E8EAED" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">A</text>
            <circle cx="120" cy="48" r="2" fill="#2C303D"/>
            <circle cx="120" cy="60" r="2" fill="#2C303D"/>
            <circle cx="120" cy="72" r="2" fill="#2C303D"/>
            <g fill="#1F222B" fill-opacity="0.75">
              <rect x="146" y="26" width="22" height="20" rx="4"/>
              <rect x="172" y="26" width="22" height="20" rx="4"/>
              <rect x="198" y="26" width="22" height="20" rx="4"/>
              <rect x="140" y="50" width="22" height="20" rx="4"/>
              <rect x="166" y="50" width="22" height="20" rx="4"/>
              <rect x="192" y="50" width="22" height="20" rx="4"/>
              <rect x="146" y="74" width="48" height="20" rx="4"/>
              <rect x="198" y="74" width="22" height="20" rx="4"/>
            </g>
          </svg>
          EOF

          cat << 'EOF' > README.md
          <p align="center">
            <img src="assets/logo.svg" width="280" alt="Padsplit IME Logo" />
          </p>
          <h1 align="center">Padsplit IME</h1>
          <p align="center">
            <b>Ultra-minimal, landscape-only split Android keyboard designed for physical game controllers.</b>
          </p>

          ---

          ## 📥 Download the App (APK)
          1. Go to the **[Releases](../../releases/latest)** section on this page.
          2. Tap **`Padsplit-IME.apk`** under **Assets** to download and install it on your Android phone.
          3. On your phone, go to **Settings → System → Keyboard → On-screen keyboard** and turn on **Padsplit IME**.

          ---

          ## 🎮 Gamepad Controls
          * **D-Pad / Left Stick:** Move highlight across Left and Right key clusters
          * **L1 / R1:** Instant jump between Left and Right sides
          * **Button A:** Type highlighted key
          * **Button B:** Backspace
          * **Button X:** Spacebar
          * **Button Y:** Enter / Send
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PadsplitIME"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.5.0'
              id 'org.jetbrains.kotlin.android' version '1.9.24'
          }

          android {
              namespace 'com.padsplit.ime'
              compileSdk 34

              defaultConfig {
                  applicationId "com.padsplit.ime"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen.multitouch.distinct" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Padsplit IME"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PadsplitIME">
                  <service
                      android:name=".PadsplitInputMethodService"
                      android:directBootAware="true"
                      android:exported="true"
                      android:label="Padsplit IME"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#06080E" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#1F222B" android:pathData="M18,34h12v12h-12z M33,34h12v12h-12z M36,49h12v12h-12z M18,64h27v12h-27z" />
              <path android:fillColor="#1F222B" android:strokeColor="#C8CCD4" android:strokeWidth="1.2" android:pathData="M21,49h12v12h-12z" />
              <path android:fillColor="#1F222B" android:pathData="M63,34h12v12h-12z M78,34h12v12h-12z M60,49h12v12h-12z M75,49h12v12h-12z M63,64h27v12h-27z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:isAuxiliary="false"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype
                  android:icon="@android:drawable/ic_menu_edit"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard"
                  android:isAsciiCapable="true"
                  android:label="Padsplit Landscape (EN)" />
          </input-method>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_keycap.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_selected="true" android:state_pressed="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#802C303D" />
                      <corners android:radius="7dp" />
                      <stroke android:width="1dp" android:color="#E2E5EC" />
                  </shape>
              </item>
              <item android:state_selected="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#591F222B" />
                      <corners android:radius="7dp" />
                      <stroke android:width="1dp" android:color="#C8CCD4" />
                  </shape>
              </item>
              <item android:state_pressed="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#732C303D" />
                      <corners android:radius="7dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#591F222B" />
                      <corners android:radius="7dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PadsplitIME" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:navigationBarColor">#06080E</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
              </style>
              <style name="PadsplitKey">
                  <item name="android:layout_width">0dp</item>
                  <item name="android:layout_height">42dp</item>
                  <item name="android:layout_weight">1</item>
                  <item name="android:layout_margin">2.5dp</item>
                  <item name="android:background">@drawable/bg_keycap</item>
                  <item name="android:gravity">center</item>
                  <item name="android:textColor">#E8EAED</item>
                  <item name="android:textSize">17sp</item>
                  <item name="android:fontFamily">sans-serif</item>
                  <item name="android:clickable">true</item>
                  <item name="android:focusable">false</item>
                  <item name="android:soundEffectsEnabled">true</item>
                  <item name="android:includeFontPadding">false</item>
              </style>
              <style name="PadsplitKey.Modifier" parent="PadsplitKey">
                  <item name="android:textColor">#9AA0A6</item>
                  <item name="android:textSize">13sp</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/padsplit_keyboard_view.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/keyboard_root"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="#06080E"
              android:baselineAligned="false"
              android:orientation="horizontal"
              android:paddingStart="6dp"
              android:paddingTop="6dp"
              android:paddingEnd="6dp"
              android:paddingBottom="8dp"
              android:splitMotionEvents="true"
              android:weightSum="1.0">

              <LinearLayout
                  android:id="@+id/left_cluster"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="0.35"
                  android:orientation="vertical"
                  android:splitMotionEvents="true">

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:splitMotionEvents="true">
                      <TextView android:id="@+id/key_q" style="@style/PadsplitKey" android:text="Q" />
                      <TextView android:id="@+id/key_w" style="@style/PadsplitKey" android:text="W" />
                      <TextView android:id="@+id/key_e" style="@style/PadsplitKey" android:text="E" />
                      <TextView android:id="@+id/key_r" style="@style/PadsplitKey" android:text="R" />
                      <TextView android:id="@+id/key_t" style="@style/PadsplitKey" android:text="T" />
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:paddingStart="8dp" android:splitMotionEvents="true">
                      <TextView android:id="@+id/key_a" style="@style/PadsplitKey" android:text="A" />
                      <TextView android:id="@+id/key_s" style="@style/PadsplitKey" android:text="S" />
                      <TextView android:id="@+id/key_d" style="@style/PadsplitKey" android:text="D" />
                      <TextView android:id="@+id/key_f" style="@style/PadsplitKey" android:text="F" />
                      <TextView android:id="@+id/key_g" style="@style/PadsplitKey" android:text="G" />
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:splitMotionEvents="true">
                      <TextView android:id="@+id/key_shift" style="@style/PadsplitKey.Modifier" android:text="⇧" android:textSize="16sp" />
                      <TextView android:id="@+id/key_z" style="@style/PadsplitKey" android:text="Z" />
                      <TextView android:id="@+id/key_x" style="@style/PadsplitKey" android:text="X" />
                      <TextView android:id="@+id/key_c" style="@style/PadsplitKey" android:text="C" />
                      <TextView android:id="@+id/key_v" style="@style/PadsplitKey" android:text="V" />
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:splitMotionEvents="true" android:weightSum="5">
                      <TextView android:id="@+id/key_sym" style="@style/PadsplitKey.Modifier" android:layout_weight="1" android:text="\?123" />
                      <TextView android:id="@+id/key_comma" style="@style/PadsplitKey" android:layout_weight="1" android:text="," />
                      <TextView android:id="@+id/key_space_left" style="@style/PadsplitKey.Modifier" android:layout_weight="3" android:text="" />
                  </LinearLayout>
              </LinearLayout>

              <Space
                  android:id="@+id/center_spacer"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="0.30" />

              <LinearLayout
                  android:id="@+id/right_cluster"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="0.35"
                  android:orientation="vertical"
                  android:splitMotionEvents="true">

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:splitMotionEvents="true">
                      <TextView android:id="@+id/key_y" style="@style/PadsplitKey" android:text="Y" />
                      <TextView android:id="@+id/key_u" style="@style/PadsplitKey" android:text="U" />
                      <TextView android:id="@+id/key_i" style="@style/PadsplitKey" android:text="I" />
                      <TextView android:id="@+id/key_o" style="@style/PadsplitKey" android:text="O" />
                      <TextView android:id="@+id/key_p" style="@style/PadsplitKey" android:text="P" />
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:paddingStart="12dp" android:paddingEnd="12dp" android:splitMotionEvents="true">
                      <TextView android:id="@+id/key_h" style="@style/PadsplitKey" android:text="H" />
                      <TextView android:id="@+id/key_j" style="@style/PadsplitKey" android:text="J" />
                      <TextView android:id="@+id/key_k" style="@style/PadsplitKey" android:text="K" />
                      <TextView android:id="@+id/key_l" style="@style/PadsplitKey" android:text="L" />
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:splitMotionEvents="true" android:weightSum="5">
                      <TextView android:id="@+id/key_b" style="@style/PadsplitKey" android:layout_weight="1" android:text="B" />
                      <TextView android:id="@+id/key_n" style="@style/PadsplitKey" android:layout_weight="1" android:text="N" />
                      <TextView android:id="@+id/key_m" style="@style/PadsplitKey" android:layout_weight="1" android:text="M" />
                      <TextView android:id="@+id/key_delete" style="@style/PadsplitKey.Modifier" android:layout_weight="2" android:text="⌫" android:textSize="16sp" />
                  </LinearLayout>

                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:splitMotionEvents="true" android:weightSum="5">
                      <TextView android:id="@+id/key_space" style="@style/PadsplitKey.Modifier" android:layout_weight="3" android:text="Space" />
                      <TextView android:id="@+id/key_period" style="@style/PadsplitKey" android:layout_weight="1" android:text="." />
                      <TextView android:id="@+id/key_enter" style="@style/PadsplitKey.Modifier" android:layout_weight="1" android:text="↵" android:textSize="16sp" />
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/padsplit/ime/PadsplitInputMethodService.kt
          package com.padsplit.ime

          import android.annotation.SuppressLint
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.view.InputDevice
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.SoundEffectConstants
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.TextView
          import kotlin.math.abs

          class PadsplitInputMethodService : InputMethodService() {
              private var rootView: View? = null

              private companion object {
                  const val CLUSTER_LEFT = 0
                  const val CLUSTER_RIGHT = 1
                  const val STICK_DEADZONE = 0.45f
                  const val STICK_REPEAT_INITIAL_DELAY_MS = 280L
                  const val STICK_REPEAT_INTERVAL_MS = 110L
              }

              private var keyMatrix: Array<Array<Array<TextView>>> = emptyArray()
              private var focusCluster = CLUSTER_LEFT
              private var focusRow = 1
              private var focusCol = 0
              private var isShifted = true
              private var isSymbolLayer = false

              private val mainHandler = Handler(Looper.getMainLooper())
              private var activeStickDirX = 0
              private var activeStickDirY = 0

        
